<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur" />
      <feOffset dx="0" dy="10" result="offsetBlur" />
      <feMerge>
        <feMergeNode in="offsetBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="#0F172A" />
  
  <!-- Outer Ring -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="url(#grad1)" stroke-width="20" stroke-dasharray="100,50" opacity="0.5" />
  
  <!-- Main Icon Shape (T and V combined look) -->
  <g filter="url(#shadow)">
    <!-- The "T" shape top bar -->
    <rect x="350" y="380" width="324" height="60" rx="30" fill="url(#grad1)" />
    <!-- The vertical and V connection -->
    <path d="M512 380 L512 550 L650 350" fill="none" stroke="url(#grad1)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
    <path d="M512 380 V680 Q512 750 580 750 T650 680" fill="none" stroke="url(#grad1)" stroke-width="60" stroke-linecap="round" />
    
    <!-- Central Symbol (Wrench/Tool cross style) -->
    <path d="M440 512 H584 M512 440 V584" stroke="white" stroke-width="40" stroke-linecap="round" />
  </g>
  
  <!-- Text inside logo (Optional, but looks cleaner without for app icon) -->
  <!-- <text x="512" y="850" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">TOOLVERSE</text> -->
</svg>
